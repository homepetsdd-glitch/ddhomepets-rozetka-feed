name: Publish Rozetka feed

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Prom XML
        env:
          PROM_SOURCE_URL: ${{ secrets.PROM_SOURCE_URL }}
        run: |
          mkdir -p _site
          curl --fail --location --silent --show-error "$PROM_SOURCE_URL" -o _site/feed.xml

      - name: Check XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("_site/feed.xml")
          print("XML OK")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
